---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zakera-data
  namespace: zakera
  labels:
    app: zakera
spec:
  accessModes:
  - ReadWriteMany  # Multiple pods can access
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zakera-logs
  namespace: zakera
  labels:
    app: zakera
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard

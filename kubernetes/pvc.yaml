apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zakera-data-pvc
  namespace: zakera-prod
  labels:
    app: zakera-api
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zakera-logs-pvc
  namespace: zakera-prod
  labels:
    app: zakera-api
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard

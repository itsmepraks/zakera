# Network Policies for Security
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zakera-api-network-policy
  namespace: zakera
spec:
  podSelector:
    matchLabels:
      app: zakera
      component: api
  policyTypes:
  - Ingress
  - Egress
  
  ingress:
  # Allow from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  
  # Allow from Prometheus
  - from:
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 9090
  
  egress:
  # Allow to PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          component: postgres
    ports:
    - protocol: TCP
      port: 5432
  
  # Allow to Redis
  - to:
    - podSelector:
        matchLabels:
          component: redis
    ports:
    - protocol: TCP
      port: 6379
  
  # Allow DNS
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
  
  # Allow HTTPS for external APIs
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-network-policy
  namespace: zakera
spec:
  podSelector:
    matchLabels:
      component: postgres
  policyTypes:
  - Ingress
  
  ingress:
  # Only allow from API pods
  - from:
    - podSelector:
        matchLabels:
          app: zakera
          component: api
    ports:
    - protocol: TCP
      port: 5432

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-network-policy
  namespace: zakera
spec:
  podSelector:
    matchLabels:
      component: redis
  policyTypes:
  - Ingress
  
  ingress:
  # Only allow from API pods
  - from:
    - podSelector:
        matchLabels:
          app: zakera
          component: api
    ports:
    - protocol: TCP
      port: 6379

# Resource quotas for namespace
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: zakera-production-quota
  namespace: zakera-production
spec:
  hard:
    # Compute resources
    requests.cpu: "50"
    requests.memory: 100Gi
    limits.cpu: "100"
    limits.memory: 200Gi
    # Storage
    persistentvolumeclaims: "10"
    requests.storage: 500Gi
    # Objects
    pods: "100"
    services: "20"
    configmaps: "50"
    secrets: "50"
    # Load balancers
    services.loadbalancers: "5"
---
# Limit ranges for default resource constraints
apiVersion: v1
kind: LimitRange
metadata:
  name: zakera-production-limits
  namespace: zakera-production
spec:
  limits:
    # Container defaults
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "4"
        memory: 8Gi
      min:
        cpu: 50m
        memory: 64Mi
    # Pod limits
    - type: Pod
      max:
        cpu: "8"
        memory: 16Gi
      min:
        cpu: 100m
        memory: 128Mi
    # PVC limits
    - type: PersistentVolumeClaim
      max:
        storage: 100Gi
      min:
        storage: 1Gi

apiVersion: v1
kind: ConfigMap
metadata:
  name: zakera-config
  namespace: zakera-prod
data:
  # Application environment
  environment: "production"
  
  # Model configuration
  default_model: "llama-3.1-70b-versatile"
  enable_groq: "true"
  enable_ollama: "false"
  enable_openai: "true"
  enable_anthropic: "true"
  enable_model_fallback: "true"
  fallback_strategy: "sequential"
  
  # Server configuration
  host: "0.0.0.0"
  port: "8000"
  workers: "4"
  
  # Monitoring
  enable_metrics: "true"
  enable_alerts: "true"
  log_level: "INFO"
  log_format: "json"
  
  # Rate limiting
  rate_limit_enabled: "true"
  rate_limit_per_minute: "60"
  
  # CORS configuration
  allowed_origins: "https://zakera.example.com,https://www.zakera.example.com"
  
  # Database
  database_pool_size: "20"
  database_max_overflow: "10"
  
  # Redis
  redis_url: "redis://zakera-redis:6379/0"
  
  # Feature flags
  enable_tools: "true"
  enable_memory: "true"
  enable_streaming: "true"
  
  # Performance
  max_concurrent_requests: "100"
  request_timeout: "300"
  
  # Security
  enable_rate_limiting: "true"
  enable_authentication: "true"
  jwt_expiration: "86400"

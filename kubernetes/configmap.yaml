---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zakera-config
  namespace: zakera
data:
  # Application
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  
  # Features
  ENABLE_METRICS: "true"
  ENABLE_AUDIT_LOGGING: "true"
  ENABLE_RATE_LIMITING: "true"
  
  # CORS
  ALLOWED_ORIGINS: "https://zakera.io,https://app.zakera.io"
  
  # Token settings
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  
  # Rate limiting
  RATE_LIMIT_PER_MINUTE: "60"
  RATE_LIMIT_PER_HOUR: "1000"
  
  # MFA
  MFA_ISSUER_NAME: "Zakera"
  REQUIRE_MFA_FOR_ADMINS: "true"
  
  # Memory
  DEFAULT_MAX_TOKENS: "4000"
  SUMMARIZATION_STRATEGY: "adaptive"
  
  # Models
  DEFAULT_MODEL: "gpt-4-turbo"
  ENABLE_MODEL_FALLBACK: "true"
  FALLBACK_STRATEGY: "sequential"
  
  # Redis
  REDIS_URL: "redis://zakera-redis:6379/0"
  
  # Monitoring
  PROMETHEUS_PORT: "9090"
  METRICS_NAMESPACE: "zakera"

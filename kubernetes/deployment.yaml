---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zakera-api
  namespace: zakera
  labels:
    app: zakera
    component: api
    version: v0.6.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: zakera
      component: api
  template:
    metadata:
      labels:
        app: zakera
        component: api
        version: v0.6.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/api/v1/monitoring/metrics"
    spec:
      serviceAccountName: zakera
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      initContainers:
      - name: db-migration
        image: zakera:latest
        command: ["alembic", "upgrade", "head"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: zakera-secrets
              key: database-url
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      
      containers:
      - name: zakera
        image: zakera:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        
        env:
        # Application settings
        - name: API_HOST
          value: "0.0.0.0"
        - name: API_PORT
          value: "8000"
        - name: LOG_LEVEL
          value: "INFO"
        - name: ENVIRONMENT
          value: "production"
        
        # Database
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: zakera-secrets
              key: database-url
        
        # Security
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: zakera-secrets
              key: secret-key
        
        # OpenAI
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: zakera-secrets
              key: openai-api-key
              optional: true
        
        # Anthropic
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: zakera-secrets
              key: anthropic-api-key
              optional: true
        
        # Google
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: zakera-secrets
              key: google-api-key
              optional: true
        
        # OAuth2
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: zakera-config
              key: google-client-id
              optional: true
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: zakera-secrets
              key: google-client-secret
              optional: true
        
        # Redis (for caching)
        - name: REDIS_URL
          value: "redis://zakera-redis:6379/0"
        
        # Monitoring
        - name: ENABLE_METRICS
          value: "true"
        - name: ENABLE_AUDIT_LOGGING
          value: "true"
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /api/v1/monitoring/health/live
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /api/v1/monitoring/health/ready
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        
        # Startup probe for slow starts
        startupProbe:
          httpGet:
            path: /api/v1/monitoring/health/live
            port: 8000
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        
        # Resource management
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        
        # Volume mounts
        volumeMounts:
        - name: logs
          mountPath: /app/logs
        - name: data
          mountPath: /app/data
        - name: config
          mountPath: /app/config
          readOnly: true
      
      volumes:
      - name: logs
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: zakera-data
      - name: config
        configMap:
          name: zakera-config
      
      # Affinity rules for HA
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - zakera
              topologyKey: kubernetes.io/hostname

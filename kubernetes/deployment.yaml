apiVersion: apps/v1
kind: Deployment
metadata:
  name: zakera-api
  namespace: zakera-prod
  labels:
    app: zakera-api
    tier: backend
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: zakera-api
  template:
    metadata:
      labels:
        app: zakera-api
        tier: backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/api/v1/monitoring/metrics"
    spec:
      serviceAccountName: zakera-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      # Init container for database migrations
      initContainers:
      - name: migrate-db
        image: zakera:latest
        command: ["python", "-m", "alembic", "upgrade", "head"]
        envFrom:
        - configMapRef:
            name: zakera-config
        - secretRef:
            name: zakera-secrets
        volumeMounts:
        - name: data
          mountPath: /app/data
      
      containers:
      - name: zakera-api
        image: zakera:latest
        imagePullPolicy: Always
        
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        
        env:
        # Environment variables from ConfigMap
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: zakera-config
              key: environment
        
        - name: DEFAULT_MODEL
          valueFrom:
            configMapKeyRef:
              name: zakera-config
              key: default_model
        
        - name: ENABLE_METRICS
          valueFrom:
            configMapKeyRef:
              name: zakera-config
              key: enable_metrics
        
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: zakera-config
              key: log_level
        
        # Secrets
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: zakera-secrets
              key: openai-api-key
        
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: zakera-secrets
              key: anthropic-api-key
        
        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: zakera-secrets
              key: groq-api-key
        
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: zakera-secrets
              key: database-url
        
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: zakera-secrets
              key: secret-key
        
        # Resource limits and requests
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 2Gi
        
        # Liveness probe - checks if container is alive
        livenessProbe:
          httpGet:
            path: /api/v1/monitoring/health/live
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Readiness probe - checks if container is ready to serve traffic
        readinessProbe:
          httpGet:
            path: /api/v1/monitoring/health/ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        # Startup probe - gives more time for application startup
        startupProbe:
          httpGet:
            path: /api/v1/monitoring/health/ready
            port: http
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        
        # Volume mounts
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: logs
          mountPath: /app/logs
        - name: config
          mountPath: /app/config
          readOnly: true
        
        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
      
      # Volumes
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: zakera-data-pvc
      
      - name: logs
        emptyDir: {}
      
      - name: config
        configMap:
          name: zakera-config
      
      # Node affinity for optimal placement
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - zakera-api
              topologyKey: kubernetes.io/hostname
      
      # Toleration for spot instances
      tolerations:
      - key: "workload"
        operator: "Equal"
        value: "spot"
        effect: "NoSchedule"

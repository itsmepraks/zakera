apiVersion: v1
kind: Service
metadata:
  name: zakera-api
  namespace: zakera-prod
  labels:
    app: zakera-api
    tier: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/api/v1/monitoring/metrics"
spec:
  type: ClusterIP
  selector:
    app: zakera-api
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
apiVersion: v1
kind: Service
metadata:
  name: zakera-api-headless
  namespace: zakera-prod
  labels:
    app: zakera-api
spec:
  clusterIP: None
  selector:
    app: zakera-api
  ports:
  - name: http
    port: 8000
    targetPort: http

---
apiVersion: v1
kind: Service
metadata:
  name: zakera-api
  namespace: zakera
  labels:
    app: zakera
    component: api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  selector:
    app: zakera
    component: api
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8000
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
apiVersion: v1
kind: Service
metadata:
  name: zakera-api-internal
  namespace: zakera
  labels:
    app: zakera
    component: api
spec:
  type: ClusterIP
  selector:
    app: zakera
    component: api
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: zakera-redis
  namespace: zakera
  labels:
    app: zakera
    component: redis
spec:
  type: ClusterIP
  selector:
    app: zakera
    component: redis
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP

---
# Service for Zakera API
apiVersion: v1
kind: Service
metadata:
  name: zakera-api-service
  namespace: zakera-production
  labels:
    app: zakera
    component: api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: ClusterIP
  selector:
    app: zakera
    component: api
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
# Headless Service for StatefulSet (if needed)
apiVersion: v1
kind: Service
metadata:
  name: zakera-api-headless
  namespace: zakera-production
  labels:
    app: zakera
    component: api
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: zakera
    component: api
  ports:
  - name: http
    port: 8000
    targetPort: 8000

---
# Ingress with TLS and advanced routing
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zakera-ingress
  namespace: zakera-production
  labels:
    app: zakera
  annotations:
    # Nginx Ingress Controller
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    
    # HTTPS/TLS Configuration
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    cert-manager.io/acme-challenge-type: "http01"
    
    # Rate Limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"
    
    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    
    # Body Size
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    
    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://zakera.ai,https://www.zakera.ai"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"
    
    # Security Headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Permissions-Policy: geolocation=(), microphone=(), camera=()";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';";
    
    # Additional Settings
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "zakera-session"
    nginx.ingress.kubernetes.io/session-cookie-expires: "3600"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "3600"
    
    # Monitoring
    nginx.ingress.kubernetes.io/enable-opentelemetry: "true"
    
spec:
  tls:
  - hosts:
    - api.zakera.ai
    - zakera.ai
    secretName: zakera-tls-cert
  
  rules:
  # Main API
  - host: api.zakera.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: zakera-api-service
            port:
              number: 80
  
  # Root domain redirect to API
  - host: zakera.ai
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: zakera-api-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: zakera-frontend-service
            port:
              number: 80

---
# Certificate for TLS
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: zakera-tls
  namespace: zakera-production
spec:
  secretName: zakera-tls-cert
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - zakera.ai
  - api.zakera.ai
  - www.zakera.ai
  privateKey:
    algorithm: RSA
    size: 2048
    rotationPolicy: Always
  renewBefore: 720h # 30 days
  usages:
  - digital signature
  - key encipherment
  - server auth

---
# ClusterIssuer for Let's Encrypt
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@zakera.ai
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
    - http01:
        ingress:
          class: nginx

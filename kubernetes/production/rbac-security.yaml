---
# Namespace for Production
apiVersion: v1
kind: Namespace
metadata:
  name: zakera-production
  labels:
    name: zakera-production
    environment: production
    istio-injection: enabled  # Enable Istio service mesh
  annotations:
    scheduler.alpha.kubernetes.io/node-selector: "environment=production"

---
# Service Account for API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zakera-api-sa
  namespace: zakera-production
  labels:
    app: zakera
    component: api
automountServiceAccountToken: true

---
# Role for API Pods
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zakera-api-role
  namespace: zakera-production
rules:
# Allow reading ConfigMaps
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
# Allow reading Secrets
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
# Allow pod information for monitoring
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
# Allow service discovery
- apiGroups: [""]
  resources: ["services", "endpoints"]
  verbs: ["get", "list", "watch"]

---
# RoleBinding for API
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zakera-api-rolebinding
  namespace: zakera-production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zakera-api-role
subjects:
- kind: ServiceAccount
  name: zakera-api-sa
  namespace: zakera-production

---
# Network Policy - Restrict ingress/egress traffic
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zakera-api-network-policy
  namespace: zakera-production
spec:
  podSelector:
    matchLabels:
      app: zakera
      component: api
  policyTypes:
  - Ingress
  - Egress
  
  # Ingress rules
  ingress:
  # Allow from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  
  # Allow from monitoring (Prometheus)
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9090
  
  # Allow from same namespace (inter-service)
  - from:
    - podSelector:
        matchLabels:
          app: zakera
    ports:
    - protocol: TCP
      port: 8000
  
  # Egress rules
  egress:
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
  
  # Allow PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  
  # Allow Redis
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  
  # Allow external API calls (AI providers)
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
  
  # Allow Jaeger tracing
  - to:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 4317

---
# Pod Security Policy (deprecated in k8s 1.25+, use Pod Security Standards)
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: zakera-restricted-psp
  annotations:
    seccomp.security.alpha.kubernetes.io/allowedProfileNames: 'runtime/default'
    apparmor.security.beta.kubernetes.io/allowedProfileNames: 'runtime/default'
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
  - ALL
  volumes:
  - 'configMap'
  - 'emptyDir'
  - 'projected'
  - 'secret'
  - 'downwardAPI'
  - 'persistentVolumeClaim'
  hostNetwork: false
  hostIPC: false
  hostPID: false
  runAsUser:
    rule: 'MustRunAsNonRoot'
  seLinux:
    rule: 'RunAsAny'
  supplementalGroups:
    rule: 'RunAsAny'
  fsGroup:
    rule: 'RunAsAny'
  readOnlyRootFilesystem: true

---
# Pod Security Standards (for k8s 1.25+)
apiVersion: v1
kind: Namespace
metadata:
  name: zakera-production
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---
# Resource Quota for Namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: zakera-production-quota
  namespace: zakera-production
spec:
  hard:
    requests.cpu: "50"
    requests.memory: "100Gi"
    limits.cpu: "100"
    limits.memory: "200Gi"
    persistentvolumeclaims: "10"
    services.loadbalancers: "2"
    services.nodeports: "0"
    pods: "100"

---
# Limit Range for Pods
apiVersion: v1
kind: LimitRange
metadata:
  name: zakera-production-limits
  namespace: zakera-production
spec:
  limits:
  # Container limits
  - type: Container
    max:
      cpu: "4"
      memory: "4Gi"
    min:
      cpu: "100m"
      memory: "128Mi"
    default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "250m"
      memory: "256Mi"
  # Pod limits
  - type: Pod
    max:
      cpu: "8"
      memory: "8Gi"
  # PVC limits
  - type: PersistentVolumeClaim
    max:
      storage: "100Gi"
    min:
      storage: "1Gi"

---
# Service Monitor for Prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: zakera-api-metrics
  namespace: zakera-production
  labels:
    app: zakera
    component: api
    prometheus: kube-prometheus
spec:
  selector:
    matchLabels:
      app: zakera
      component: api
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
    scheme: http
    scrapeTimeout: 10s
    relabelings:
    - sourceLabels: [__meta_kubernetes_pod_name]
      targetLabel: pod
    - sourceLabels: [__meta_kubernetes_pod_node_name]
      targetLabel: node
  namespaceSelector:
    matchNames:
    - zakera-production

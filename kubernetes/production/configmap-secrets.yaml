---
# ConfigMap for non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: zakera-config
  namespace: zakera-production
  labels:
    app: zakera
    environment: production
data:
  # Application Configuration
  ENVIRONMENT: "production"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  WORKERS: "4"
  WORKER_CLASS: "uvicorn.workers.UvicornWorker"
  
  # Features
  ENABLE_STREAMING: "true"
  ENABLE_TOOLS: "true"
  ENABLE_MEMORY: "true"
  ENABLE_VECTOR_MEMORY: "true"
  ENABLE_DOCS: "false"  # Disable in production
  
  # Monitoring
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "true"
  ENABLE_LOGGING: "true"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  METRICS_PORT: "9090"
  
  # OpenTelemetry
  OTEL_SERVICE_NAME: "zakera-ai-agent"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector.monitoring:4317"
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "0.1"  # Sample 10% in production
  
  # Database
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "40"
  DB_POOL_TIMEOUT: "30"
  
  # Redis
  REDIS_HOST: "redis-master.zakera-production"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_SSL: "true"
  CACHE_TTL_DEFAULT: "3600"
  CACHE_TTL_CONVERSATION: "7200"
  CACHE_TTL_MODEL_RESPONSE: "1800"
  
  # Performance
  REQUEST_TIMEOUT: "60"
  KEEPALIVE_TIMEOUT: "5"
  MAX_MEMORY_MB: "1536"
  
  # Rate Limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_PER_MINUTE: "100"
  RATE_LIMIT_BURST: "20"
  
  # CORS
  CORS_ALLOW_CREDENTIALS: "true"
  
  # Model Defaults
  DEFAULT_MODEL: "gpt-4-turbo"

---
# Application-specific ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: zakera-app-config
  namespace: zakera-production
data:
  app.yaml: |
    # Application configuration file
    app:
      name: zakera
      version: 1.0.0
      environment: production
    
    security:
      max_upload_size: 10485760  # 10MB
      allowed_file_types:
        - .txt
        - .md
        - .py
        - .js
        - .ts
    
    ai_models:
      timeout: 60
      max_retries: 3
      retry_delay: 1
      fallback_enabled: true
    
    monitoring:
      metrics_enabled: true
      tracing_enabled: true
      log_level: INFO

---
# Secrets (base64 encoded - replace with actual values)
# In production, use external secret management (Vault, AWS Secrets Manager, etc.)
apiVersion: v1
kind: Secret
metadata:
  name: zakera-secrets
  namespace: zakera-production
  labels:
    app: zakera
    environment: production
type: Opaque
stringData:
  # Database Connection
  DATABASE_URL: "postgresql://zakera_user:CHANGE_ME@postgres-service:5432/zakera_prod"
  
  # JWT Secret
  JWT_SECRET_KEY: "CHANGE_ME_TO_SECURE_RANDOM_STRING"
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  
  # Redis Password
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"
  
  # API Keys (Base64 encode these in production)
  OPENAI_API_KEY: "sk-YOUR-OPENAI-KEY"
  ANTHROPIC_API_KEY: "sk-ant-YOUR-ANTHROPIC-KEY"
  GOOGLE_API_KEY: "YOUR-GOOGLE-API-KEY"
  COHERE_API_KEY: "YOUR-COHERE-KEY"
  GROQ_API_KEY: "gsk_YOUR-GROQ-KEY"
  MISTRAL_API_KEY: "YOUR-MISTRAL-KEY"
  HUGGINGFACE_API_TOKEN: "hf_YOUR-HF-TOKEN"
  XAI_API_KEY: "xai-YOUR-XAI-KEY"
  
  # CORS Origins
  CORS_ORIGINS: "https://zakera.ai,https://www.zakera.ai,https://api.zakera.ai"
  
  # Alerting (Email)
  ALERT_EMAIL_SMTP_HOST: "smtp.gmail.com"
  ALERT_EMAIL_SMTP_PORT: "587"
  ALERT_EMAIL_USERNAME: "alerts@zakera.ai"
  ALERT_EMAIL_PASSWORD: "YOUR_EMAIL_APP_PASSWORD"
  ALERT_EMAIL_FROM: "alerts@zakera.ai"
  ALERT_EMAIL_TO: "admin@zakera.ai"
  
  # Alerting (Slack)
  ALERT_SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
  
  # Alerting (Discord)
  ALERT_DISCORD_WEBHOOK_URL: "https://discord.com/api/webhooks/YOUR/WEBHOOK/URL"


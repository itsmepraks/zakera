apiVersion: v1
kind: ServiceAccount
metadata:
  name: zakera-sa
  namespace: zakera-prod
  labels:
    app: zakera-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zakera-role
  namespace: zakera-prod
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zakera-rolebinding
  namespace: zakera-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zakera-role
subjects:
- kind: ServiceAccount
  name: zakera-sa
  namespace: zakera-prod

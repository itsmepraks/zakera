---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zakera
  namespace: zakera
  labels:
    app: zakera

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zakera-role
  namespace: zakera
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zakera-rolebinding
  namespace: zakera
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zakera-role
subjects:
- kind: ServiceAccount
  name: zakera
  namespace: zakera

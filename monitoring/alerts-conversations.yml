groups:
  - name: conversation_alerts
    interval: 30s
    rules:
      # High conversation failure rate
      - alert: HighConversationFailureRate
        expr: |
          (
            rate(zakera_conversations_failed_total[5m]) 
            / 
            rate(zakera_conversations_started_total[5m])
          ) > 0.10
        for: 5m
        labels:
          severity: critical
          component: conversations
        annotations:
          summary: "High conversation failure rate detected"
          description: "Conversation failure rate is {{ $value | humanizePercentage }} over the last 5 minutes"
          dashboard: "http://grafana:3000/d/conversations"

      # Database connection pool exhausted
      - alert: DatabaseConnectionPoolExhausted
        expr: |
          zakera_db_connections_active >= zakera_db_pool_size
        for: 2m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Database connection pool exhausted"
          description: "All {{ $value }} database connections are in use. Service degradation imminent."
          
      # High database query latency
      - alert: HighDatabaseQueryLatency
        expr: |
          histogram_quantile(0.95, rate(zakera_db_query_duration_seconds_bucket[5m])) > 1.0
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "High database query latency"
          description: "95th percentile query latency is {{ $value }}s (threshold: 1s)"
          
      # Message persistence failures
      - alert: MessagePersistenceFailures
        expr: |
          rate(zakera_message_save_errors_total[5m]) > 0
        for: 3m
        labels:
          severity: critical
          component: persistence
        annotations:
          summary: "Message persistence failures detected"
          description: "{{ $value }} message save failures per second"
          
      # High conversation load latency
      - alert: HighConversationLoadLatency
        expr: |
          histogram_quantile(0.95, rate(zakera_conversation_load_duration_seconds_bucket[5m])) > 2.0
        for: 5m
        labels:
          severity: warning
          component: conversations
        annotations:
          summary: "Slow conversation loading"
          description: "95th percentile conversation load time is {{ $value }}s"
          
      # Model provider down
      - alert: ModelProviderDown
        expr: |
          zakera_model_provider_available{provider=~"openai|anthropic|gemini"} == 0
        for: 2m
        labels:
          severity: critical
          component: models
        annotations:
          summary: "Model provider {{ $labels.provider }} is unavailable"
          description: "Primary model provider is down. Fallback should engage."
          
      # High model error rate
      - alert: HighModelErrorRate
        expr: |
          (
            rate(zakera_model_errors_total[5m])
            /
            rate(zakera_model_requests_total[5m])
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          component: models
        annotations:
          summary: "High model error rate"
          description: "Model error rate is {{ $value | humanizePercentage }}"
          
      # Conversation search slow
      - alert: SlowConversationSearch
        expr: |
          histogram_quantile(0.95, rate(zakera_search_duration_seconds_bucket[5m])) > 3.0
        for: 5m
        labels:
          severity: warning
          component: search
        annotations:
          summary: "Slow conversation search performance"
          description: "95th percentile search time is {{ $value }}s"
          
      # Database size growing rapidly
      - alert: RapidDatabaseGrowth
        expr: |
          deriv(zakera_db_size_bytes[1h]) > 100000000
        for: 30m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Rapid database growth detected"
          description: "Database growing at {{ $value | humanize1024 }}/hour"
          
      # Too many concurrent conversations
      - alert: TooManyConcurrentConversations
        expr: |
          zakera_conversations_active_total > 10000
        for: 5m
        labels:
          severity: warning
          component: conversations
        annotations:
          summary: "High number of concurrent conversations"
          description: "{{ $value }} active conversations (threshold: 10,000)"
          
      # Memory system cache misses
      - alert: HighMemoryCacheMissRate
        expr: |
          (
            rate(zakera_memory_cache_misses_total[5m])
            /
            (rate(zakera_memory_cache_hits_total[5m]) + rate(zakera_memory_cache_misses_total[5m]))
          ) > 0.30
        for: 10m
        labels:
          severity: warning
          component: memory
        annotations:
          summary: "High memory cache miss rate"
          description: "Cache miss rate is {{ $value | humanizePercentage }}"
          
      # Token limit exceeded frequently
      - alert: FrequentTokenLimitExceeded
        expr: |
          rate(zakera_conversation_token_limit_exceeded_total[5m]) > 0.1
        for: 5m
        labels:
          severity: info
          component: conversations
        annotations:
          summary: "Frequent token limit exceeded"
          description: "Token limits being exceeded {{ $value }} times per second"
          
      # Bulk operation failures
      - alert: BulkOperationFailures
        expr: |
          rate(zakera_bulk_operation_errors_total[5m]) > 0
        for: 3m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "Bulk operation failures detected"
          description: "Bulk operations failing at {{ $value }}/sec"
          
      # Share token generation failures
      - alert: ShareTokenGenerationFailures
        expr: |
          rate(zakera_share_creation_errors_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
          component: sharing
        annotations:
          summary: "Share creation failures"
          description: "Share token generation failing"

  - name: cost_alerts
    interval: 60s
    rules:
      # High hourly costs
      - alert: HighHourlyCost
        expr: |
          sum(rate(zakera_model_cost_total[1h])) > 10.0
        for: 10m
        labels:
          severity: warning
          component: cost
        annotations:
          summary: "High API costs detected"
          description: "Current rate: ${{ $value }}/hour (threshold: $10/hour)"
          
      # Cost spike detected
      - alert: CostSpike
        expr: |
          (
            rate(zakera_model_cost_total[5m])
            /
            rate(zakera_model_cost_total[1h] offset 1h)
          ) > 2.0
        for: 5m
        labels:
          severity: warning
          component: cost
        annotations:
          summary: "Sudden cost spike detected"
          description: "Cost increased by {{ $value }}x compared to previous hour"
          
      # Expensive model overuse
      - alert: ExpensiveModelOveruse
        expr: |
          (
            rate(zakera_model_requests_total{model=~"gpt-4.*"}[1h])
            /
            rate(zakera_model_requests_total[1h])
          ) > 0.50
        for: 30m
        labels:
          severity: info
          component: cost
        annotations:
          summary: "High usage of expensive models"
          description: "{{ $value | humanizePercentage }} of requests using GPT-4"

  - name: user_experience_alerts
    interval: 30s
    rules:
      # High API latency
      - alert: HighAPILatency
        expr: |
          histogram_quantile(0.95, rate(zakera_http_request_duration_seconds_bucket[5m])) > 5.0
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High API latency detected"
          description: "95th percentile API latency is {{ $value }}s"
          
      # Search performance degraded
      - alert: SearchPerformanceDegraded
        expr: |
          histogram_quantile(0.95, rate(zakera_search_duration_seconds_bucket[5m])) > 5.0
        for: 5m
        labels:
          severity: warning
          component: search
        annotations:
          summary: "Search performance degraded"
          description: "Search taking {{ $value }}s at p95"

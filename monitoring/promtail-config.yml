server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Zakera application logs
  - job_name: zakera-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: zakera
          environment: production
          __path__: /var/log/zakera/*.log
    
    pipeline_stages:
      # Parse JSON logs
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            request_id: request_id
            user_id: user_id
            endpoint: endpoint
            duration: duration
            status_code: status_code
      
      # Extract level
      - labels:
          level:
          request_id:
          endpoint:
      
      # Set timestamp
      - timestamp:
          source: timestamp
          format: RFC3339
      
      # Drop debug logs in production (optional)
      - match:
          selector: '{level="DEBUG"}'
          action: drop
      
      # Add severity for alerting
      - match:
          selector: '{level="ERROR"}'
          stages:
            - labels:
                severity: error
      
      - match:
          selector: '{level="CRITICAL"}'
          stages:
            - labels:
                severity: critical

  # Conversation-specific logs
  - job_name: conversation-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: conversations
          __path__: /var/log/zakera/conversations/*.log
    
    pipeline_stages:
      - json:
          expressions:
            conversation_id: conversation_id
            model: model
            tokens: tokens
            cost: cost
            duration: duration
      
      - labels:
          conversation_id:
          model:

  # Error logs
  - job_name: error-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: errors
          __path__: /var/log/zakera/errors/*.log
    
    pipeline_stages:
      - json:
          expressions:
            error_type: error_type
            stack_trace: stack_trace
            user_id: user_id
      
      - labels:
          error_type:

  # Access logs
  - job_name: access-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: access
          __path__: /var/log/zakera/access.log
    
    pipeline_stages:
      - regex:
          expression: '^(?P<ip>\S+) (?P<user>\S+) \[(?P<timestamp>[^\]]+)\] "(?P<method>\S+) (?P<path>\S+) (?P<protocol>\S+)" (?P<status>\d+) (?P<size>\d+)'
      
      - labels:
          method:
          status:
      
      - timestamp:
          source: timestamp
          format: '02/Jan/2006:15:04:05 -0700'

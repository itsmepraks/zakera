global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'zakera-ai'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules
rule_files:
  - 'alerts.yml'
  - 'alerts-conversations.yml'

# Scrape configurations
scrape_configs:
  # Zakera AI Chat Agent
  - job_name: 'zakera-api'
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/api/v1/monitoring/metrics'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          app: 'zakera'
          component: 'api'
    metric_relabel_configs:
      # Add custom labels
      - source_labels: [__name__]
        regex: 'zakera_.*'
        action: keep

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:9090']
        labels:
          component: 'prometheus'

  # Node Exporter - System metrics
  - job_name: 'node-exporter'
    scrape_interval: 30s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          component: 'system'

  # cAdvisor - Container metrics
  - job_name: 'cadvisor'
    scrape_interval: 30s
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          component: 'containers'

  # PostgreSQL Exporter (optional)
  - job_name: 'postgres'
    scrape_interval: 30s
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          component: 'database'

  # AlertManager
  - job_name: 'alertmanager'
    scrape_interval: 30s
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          component: 'alertmanager'

# Recording rules for common queries
recording_rules:
  - name: conversation_aggregations
    interval: 30s
    rules:
      # Conversation success rate
      - record: zakera:conversation_success_rate
        expr: |
          rate(zakera_conversations_completed_total[5m])
          /
          rate(zakera_conversations_started_total[5m])
      
      # Message throughput
      - record: zakera:message_throughput_per_minute
        expr: |
          rate(zakera_messages_total[1m]) * 60
      
      # Average conversation duration
      - record: zakera:avg_conversation_duration_seconds
        expr: |
          rate(zakera_conversation_duration_seconds_sum[5m])
          /
          rate(zakera_conversation_duration_seconds_count[5m])
      
      # Database query p95
      - record: zakera:db_query_p95_seconds
        expr: |
          histogram_quantile(0.95, 
            rate(zakera_db_query_duration_seconds_bucket[5m])
          )
      
      # Total cost per hour
      - record: zakera:total_cost_per_hour
        expr: |
          sum(rate(zakera_model_cost_total[1h]))
      
      # Error rate percentage
      - record: zakera:error_rate_percentage
        expr: |
          (
            rate(zakera_http_requests_total{status=~"5.."}[5m])
            /
            rate(zakera_http_requests_total[5m])
          ) * 100

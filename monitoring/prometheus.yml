global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'zakera-production'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load alert rules
rule_files:
  - 'alerts.yml'

# Scrape configurations
scrape_configs:
  # Zakera API application
  - job_name: 'zakera-api'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/api/v1/monitoring/metrics'
    static_configs:
      - targets: 
          - 'host.docker.internal:8000'  # API running on host
        labels:
          service: 'zakera-api'
          component: 'backend'
    metric_relabel_configs:
      # Drop high-cardinality labels if needed
      - source_labels: [__name__]
        regex: 'http_request_duration_seconds_bucket'
        action: keep
  
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: 
          - 'localhost:9090'
        labels:
          service: 'prometheus'
  
  # Node Exporter for system metrics (optional)
  - job_name: 'node-exporter'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'node-exporter:9100'
        labels:
          service: 'node-exporter'
          component: 'system'
  
  # AlertManager
  - job_name: 'alertmanager'
    static_configs:
      - targets:
          - 'alertmanager:9093'
        labels:
          service: 'alertmanager'
  
  # Grafana
  - job_name: 'grafana'
    static_configs:
      - targets:
          - 'grafana:3000'
        labels:
          service: 'grafana'
  
  # Database exporter (PostgreSQL - optional)
  - job_name: 'postgres-exporter'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'postgres-exporter:9187'
        labels:
          service: 'postgres'
          component: 'database'

# Storage configuration
storage:
  tsdb:
    path: /prometheus
    retention:
      time: 30d
      size: 50GB


# AlertManager configuration for Zakera

global:
  # SMTP configuration for email alerts
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'zakera-alerts@example.com'
  smtp_auth_username: 'zakera-alerts@example.com'
  smtp_auth_password: 'your-app-password'
  smtp_require_tls: true

# Templates
templates:
  - '/etc/alertmanager/template/*.tmpl'

# Route configuration
route:
  # Default receiver
  receiver: 'default'
  
  # Group alerts by these labels
  group_by: ['alertname', 'cluster', 'service']
  
  # Wait before sending notification for new group
  group_wait: 30s
  
  # Wait before sending notification about new alerts in existing group
  group_interval: 5m
  
  # Wait before sending notification again
  repeat_interval: 3h
  
  # Child routes
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      group_interval: 2m
      repeat_interval: 30m
    
    # Warning alerts - normal notification
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 2h
    
    # Database alerts - dedicated channel
    - match:
        component: database
      receiver: 'database-alerts'
      group_wait: 30s
    
    # ML inference alerts
    - match:
        component: ml-inference
      receiver: 'ml-alerts'

# Inhibition rules - suppress certain alerts when others are firing
inhibit_rules:
  # Don't alert about high error rate if application is down
  - source_match:
      alertname: 'ZakeraDown'
    target_match:
      alertname: 'HighErrorRate'
    equal: ['instance']
  
  # Don't alert about warnings if critical alert is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

# Receivers configuration
receivers:
  # Default receiver
  - name: 'default'
    email_configs:
      - to: 'team@example.com'
        headers:
          Subject: '[Zakera] {{ .Status | toUpper }}: {{ .GroupLabels.alertname }}'
    
    # Slack webhook (optional)
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
    #     channel: '#zakera-alerts'
    #     title: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
  
  # Critical alerts - multiple channels
  - name: 'critical-alerts'
    email_configs:
      - to: 'oncall@example.com,team@example.com'
        headers:
          Subject: '[CRITICAL] Zakera Alert: {{ .GroupLabels.alertname }}'
    
    # PagerDuty (optional)
    # pagerduty_configs:
    #   - service_key: 'YOUR_PAGERDUTY_SERVICE_KEY'
    #     description: '{{ .GroupLabels.alertname }}'
    
    # Slack with @channel mention
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'
    #     channel: '#zakera-critical'
    #     title: '<!channel> [CRITICAL] {{ .GroupLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
  
  # Warning alerts
  - name: 'warning-alerts'
    email_configs:
      - to: 'team@example.com'
        headers:
          Subject: '[WARNING] Zakera: {{ .GroupLabels.alertname }}'
  
  # Database alerts
  - name: 'database-alerts'
    email_configs:
      - to: 'dba@example.com,team@example.com'
        headers:
          Subject: '[Database] Zakera Alert: {{ .GroupLabels.alertname }}'
  
  # ML inference alerts
  - name: 'ml-alerts'
    email_configs:
      - to: 'ml-team@example.com,team@example.com'
        headers:
          Subject: '[ML] Zakera Alert: {{ .GroupLabels.alertname }}'

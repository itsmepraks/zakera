[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "zakera"
version = "0.5.0"
description = "Production-ready AI chat agent with multi-provider LLM support, conversation memory, tool integration, and enterprise monitoring"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Prakriti Bista", email = "53210833+itsmepraks@users.noreply.github.com"}
]
maintainers = [
    {name = "Prakriti Bista", email = "53210833+itsmepraks@users.noreply.github.com"}
]
keywords = [
    "ai", "chatbot", "llm", "gpt", "claude", "gemini", 
    "fastapi", "openai", "anthropic", "ollama",
    "conversational-ai", "multi-provider", "monitoring",
    "prometheus", "grafana", "kubernetes", "production-ready"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/itsmepraks/zakera"
Documentation = "https://github.com/itsmepraks/zakera/blob/main/docs"
Repository = "https://github.com/itsmepraks/zakera"
Issues = "https://github.com/itsmepraks/zakera/issues"
Changelog = "https://github.com/itsmepraks/zakera/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "isort>=5.12",
    "flake8>=6.0",
    "mypy>=1.0",
    "bandit>=1.7",
]
monitoring = [
    "prometheus-client>=0.17",
    "grafana-api>=1.0",
]
all = [
    "zakera[dev,monitoring]",
]

# ============================================================================
# BLACK - Code Formatting
# ============================================================================
[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | venv
  | env
  | \.eggs
  | \.tox
  | \.mypy_cache
  | \.pytest_cache
  | __pycache__
  | build
  | dist
  | node_modules
  | migrations
  | \.terraform
  | \.next
  | coverage\.xml
  | htmlcov
)/
'''

# ============================================================================
# ISORT - Import Sorting
# ============================================================================
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = [
    "*/migrations/*",
    "*/node_modules/*",
    "*/.venv/*",
    "*/venv/*",
    "*/env/*",
    "*/.terraform/*",
    "*/.next/*",
]
known_first_party = ["src"]
known_third_party = [
    "fastapi",
    "pydantic",
    "sqlalchemy",
    "pytest",
    "openai",
    "anthropic",
    "google",
    "ollama",
    "transformers",
    "prometheus_client",
]
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "FIRSTPARTY",
    "LOCALFOLDER",
]

# ============================================================================
# PYTEST - Testing Configuration
# ============================================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
    "-v",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "smoke: marks tests as smoke tests",
    "security: marks tests as security tests",
    "e2e: marks tests as end-to-end tests",
    "performance: marks tests as performance tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
asyncio_mode = "auto"

# ============================================================================
# COVERAGE - Test Coverage Configuration
# ============================================================================
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
    "*/.venv/*",
    "*/migrations/*",
    "*/node_modules/*",
    "*/.next/*",
]
parallel = true
concurrency = ["multiprocessing", "thread"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
    "class .*\\bProtocol\\):",
    "^\\s*\\.\\.\\.$",
    "pass",
]
fail_under = 70

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

# ============================================================================
# MYPY - Type Checking Configuration
# ============================================================================
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
show_error_codes = true
show_error_context = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "migrations.*"
ignore_errors = true

# ============================================================================
# BANDIT - Security Linting
# ============================================================================
[tool.bandit]
exclude_dirs = [
    "/tests/",
    "/venv/",
    "/env/",
    "/.venv/",
    "/node_modules/",
    "/migrations/",
    "/.next/",
]
skips = ["B101", "B601"]

# ============================================================================
# RUFF - Fast Python Linter (Alternative to Flake8)
# ============================================================================
[tool.ruff]
line-length = 100
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "S101",  # use of assert (acceptable in tests)
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/*" = ["F401", "F811", "S101"]

[tool.ruff.isort]
known-first-party = ["src"]

# ============================================================================
# SETUPTOOLS - Package Configuration
# ============================================================================
[tool.setuptools]
packages = ["src"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.yml", "*.toml", "*.md"]

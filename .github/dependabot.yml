# =============================================================================
# dependabot.yml
# =============================================================================
# Keeps the small active GitHub Actions surface current during the redesign.
# Python and npm update PRs are paused until the vNext package boundaries exist.
# =============================================================================

version: 2

updates:
  # --------------------------------------------------------------------------
  # GitHub Actions
  # --------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    assignees:
      - itsmepraks
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
      include: scope
    open-pull-requests-limit: 3

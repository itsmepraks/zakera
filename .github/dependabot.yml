# =============================================================================
# dependabot.yml
# =============================================================================
# Keeps Python and npm dependencies up-to-date automatically.
# PRs are grouped to reduce noise and auto-assigned to the repo owner.
# =============================================================================

version: 2

updates:
  # --------------------------------------------------------------------------
  # Python / pip (backend)
  # --------------------------------------------------------------------------
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    groups:
      backend-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "pytest*"
          - "flake8*"
          - "mypy*"
          - "coverage*"
      backend-dev-deps:
        patterns:
          - "pytest*"
          - "flake8*"
          - "mypy*"
          - "coverage*"
    assignees:
      - itsmepraks
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore"
      include: scope
    open-pull-requests-limit: 5

  # --------------------------------------------------------------------------
  # npm / Node.js (frontend)
  # --------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /src/frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    groups:
      frontend-deps:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "eslint*"
          - "jest*"
          - "@testing-library/*"
      frontend-dev-deps:
        patterns:
          - "@types/*"
          - "eslint*"
          - "jest*"
          - "@testing-library/*"
          - "typescript"
    assignees:
      - itsmepraks
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore"
      include: scope
    open-pull-requests-limit: 5

  # --------------------------------------------------------------------------
  # GitHub Actions
  # --------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    assignees:
      - itsmepraks
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
      include: scope
    open-pull-requests-limit: 3

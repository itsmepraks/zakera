name: Update Badges

on:
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-badges:
    name: Update README Badges
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate badge data
        id: badge-data
        run: |
          # Get latest workflow run status
          WORKFLOW_STATUS="${{ github.event.workflow_run.conclusion }}"
          if [ -z "$WORKFLOW_STATUS" ]; then
            WORKFLOW_STATUS="passing"
          fi
          echo "status=$WORKFLOW_STATUS" >> $GITHUB_OUTPUT

      - name: Update README with dynamic badges
        run: |
          echo "Badges are automatically generated by shields.io"
          echo "No file updates needed - badges pull from GitHub API"

      - name: Comment badge URLs
        run: |
          cat << EOF
          Available Badge URLs for README.md:
          
          CI/CD Pipeline:
          ![CI/CD](https://github.com/itsmepraks/zakera/actions/workflows/ci.yml/badge.svg)
          
          Code Coverage:
          [![codecov](https://codecov.io/gh/itsmepraks/zakera/branch/main/graph/badge.svg)](https://codecov.io/gh/itsmepraks/zakera)
          
          License:
          [![License: MIT](https://img.shields.io/badge/License-MIT-yellow.svg)](https://opensource.org/licenses/MIT)
          
          Python Version:
          ![Python](https://img.shields.io/badge/python-3.9+-blue.svg)
          
          Docker:
          [![Docker](https://img.shields.io/badge/docker-enabled-2496ED.svg?logo=docker&logoColor=white)](https://www.docker.com/)
          
          Last Commit:
          ![Last Commit](https://img.shields.io/github/last-commit/itsmepraks/zakera)
          
          Issues:
          ![Issues](https://img.shields.io/github/issues/itsmepraks/zakera)
          
          Stars:
          ![Stars](https://img.shields.io/github/stars/itsmepraks/zakera?style=social)
          EOF

# ──────────────────────────────────────────────────────────────────────────────
# Zakera legacy characterization
# Runs only the maintained legacy backend subset and frontend Jest suite.
# This workflow does not claim that the legacy application lint, type-check,
# production build, migrations, or deployment paths are ready.
# ──────────────────────────────────────────────────────────────────────────────

name: Legacy Characterization

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

# Cancel redundant runs on the same ref so we don't waste CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

# ──────────────────────────────────────────────────────────────────────────────
jobs:

  # ────────────────────────────────────────────────
  # 1. Backend: Python / pytest
  # ────────────────────────────────────────────────
  backend:
    name: Legacy Backend (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Provide dummy env-vars so settings validation doesn't fail in tests
      SECRET_KEY: ci-test-secret-key-not-real
      DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
      OPENAI_API_KEY: sk-test-000000000000000000000000000000000000000000000000
      ANTHROPIC_API_KEY: sk-ant-test-0000000000000000000000000000000000000000
      XAI_API_KEY: xai-test-000000000000000000000000000000000000000000000000
      LOG_LEVEL: WARNING

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Cache pip packages keyed on requirements hash — saves ~60 s on warm runs.
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.12-
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run maintained backend tests with coverage
        run: |
          pytest \
            tests/test_auth.py \
            tests/test_memory.py \
            tests/test_agent_run_service.py \
            tests/unit \
            --tb=short \
            --timeout=60 \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            -q

  # ────────────────────────────────────────────────
  # 2. Frontend: Node / Jest
  # ────────────────────────────────────────────────
  frontend:
    name: Legacy Frontend (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Run Jest tests
        run: |
          npm test -- \
            --coverage \
            --watchAll=false \
            --coverageReporters=lcov \
            --coverageReporters=text

  # ────────────────────────────────────────────────
  # 3. Summary gate — all jobs must pass
  # ────────────────────────────────────────────────
  ci-success:
    name: Legacy Characterization Passed
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.backend.result }}" != "success" || "${{ needs.frontend.result }}" != "success" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All maintained legacy characterization jobs passed."

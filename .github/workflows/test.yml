# ──────────────────────────────────────────────────────────────────────────────
# Zakera AI — Continuous Integration
# Runs the full Python test suite and the frontend Jest tests on every push
# and pull-request targeting main or any feature/* branch.
# ──────────────────────────────────────────────────────────────────────────────

name: Tests

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

# Cancel redundant runs on the same ref so we don't waste CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# ──────────────────────────────────────────────────────────────────────────────
jobs:

  # ────────────────────────────────────────────────
  # 1. Backend: Python / pytest
  # ────────────────────────────────────────────────
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    env:
      # Provide dummy env-vars so settings validation doesn't fail in tests
      SECRET_KEY: ci-test-secret-key-not-real
      DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
      OPENAI_API_KEY: sk-test-000000000000000000000000000000000000000000000000
      ANTHROPIC_API_KEY: sk-ant-test-0000000000000000000000000000000000000000
      XAI_API_KEY: xai-test-000000000000000000000000000000000000000000000000
      LOG_LEVEL: WARNING

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Cache pip packages keyed on requirements hash — saves ~60 s on warm runs.
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 src/ tests/ --config=.flake8 --statistics
        continue-on-error: true  # Lint warnings don't fail the build

      - name: Run pytest with coverage
        run: |
          pytest tests/ \
            --tb=short \
            --timeout=60 \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            -q

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: backend
          name: backend-py${{ matrix.python-version }}
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ────────────────────────────────────────────────
  # 2. Frontend: Node / Jest
  # ────────────────────────────────────────────────
  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20']

    defaults:
      run:
        working-directory: src/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Type-check with tsc
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Run Jest tests
        run: |
          npm test -- \
            --coverage \
            --watchAll=false \
            --coverageReporters=lcov,text

      - name: Upload frontend coverage
        uses: codecov/codecov-action@v4
        with:
          files: src/frontend/coverage/lcov.info
          flags: frontend
          name: frontend-node${{ matrix.node-version }}
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ────────────────────────────────────────────────
  # 3. Summary gate — all jobs must pass
  # ────────────────────────────────────────────────
  ci-success:
    name: CI Success
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.backend.result }}" != "success" || "${{ needs.frontend.result }}" != "success" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed ✓"

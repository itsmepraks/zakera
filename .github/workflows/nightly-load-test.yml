# ============================================================
# Nightly Load-Testing Workflow — Zakera AI Chat Agent
# ============================================================
# Runs a Locust load test against the staging environment every
# night at 02:00 UTC and on demand via workflow_dispatch.
#
# Required secrets:
#   STAGING_API_URL      — base URL of the staging deployment
#   STAGING_API_TOKEN    — pre-minted JWT for the load-test user
#   SLACK_WEBHOOK_URL    — (optional) Slack incoming webhook for alerts
# ============================================================
name: Nightly Load Test

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC every day
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Override staging URL (leave blank to use secret)'
        required: false
        default: ''
      users:
        description: 'Number of concurrent Locust users'
        required: false
        default: '50'
      spawn_rate:
        description: 'User spawn rate (users/second)'
        required: false
        default: '5'
      duration:
        description: 'Test duration (e.g. 5m, 10m)'
        required: false
        default: '5m'

jobs:
  load-test:
    name: 'Load Test — ${{ github.event.inputs.users || 50 }} users / ${{ github.event.inputs.duration || "5m" }}'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TARGET_URL: ${{ github.event.inputs.target_url || secrets.STAGING_API_URL }}
      USERS: ${{ github.event.inputs.users || '50' }}
      SPAWN_RATE: ${{ github.event.inputs.spawn_rate || '5' }}
      DURATION: ${{ github.event.inputs.duration || '5m' }}
      LOCUST_SKIP_AUTH: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install load-test dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-loadtest.txt

      - name: Validate staging URL
        run: |
          if [ -z "$TARGET_URL" ]; then
            echo "::error::TARGET_URL / STAGING_API_URL secret is not set."
            exit 1
          fi
          echo "Target: $TARGET_URL"

      - name: Run Locust (headless)
        env:
          LOCUST_API_TOKEN: ${{ secrets.STAGING_API_TOKEN }}
        run: |
          locust \
            --locustfile tests/load/locustfile.py \
            --host "$TARGET_URL" \
            --users "$USERS" \
            --spawn-rate "$SPAWN_RATE" \
            --run-time "$DURATION" \
            --headless \
            --only-summary \
            --csv locust_report \
            --html locust_report.html \
            --exit-code-on-error 0

      - name: Upload load-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report-${{ github.run_number }}
          path: |
            locust_report*.csv
            locust_report.html
          retention-days: 30

      - name: Assert performance thresholds
        run: |
          python - <<'EOF'
          import csv, sys

          P95_THRESHOLD_MS = 2000   # 2 seconds
          ERROR_RATE_THRESHOLD = 1.0  # 1 %

          failures = []

          try:
              with open("locust_report_stats.csv") as f:
                  reader = csv.DictReader(f)
                  for row in reader:
                      name = row.get("Name", "")
                      if name == "Aggregated":
                          p95 = float(row.get("95%", 0))
                          total = int(row.get("Request Count", 0) or 0)
                          failed = int(row.get("Failure Count", 0) or 0)
                          error_rate = (failed / total * 100) if total > 0 else 0

                          print(f"p95 response time : {p95:.0f} ms  (threshold: {P95_THRESHOLD_MS} ms)")
                          print(f"Error rate        : {error_rate:.2f} %  (threshold: {ERROR_RATE_THRESHOLD} %)")

                          if p95 > P95_THRESHOLD_MS:
                              failures.append(f"p95 {p95:.0f}ms exceeds {P95_THRESHOLD_MS}ms threshold")
                          if error_rate > ERROR_RATE_THRESHOLD:
                              failures.append(f"Error rate {error_rate:.2f}% exceeds {ERROR_RATE_THRESHOLD}% threshold")
          except FileNotFoundError:
              print("::warning::locust_report_stats.csv not found — skipping threshold check.")
              sys.exit(0)

          if failures:
              for f in failures:
                  print(f"::error::{f}")
              sys.exit(1)

          print("All performance thresholds passed. ✅")
          EOF

      - name: Notify Slack
        if: always()
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          STATUS="$([[ '${{ job.status }}' == 'success' ]] && echo ':white_check_mark: PASSED' || echo ':x: FAILED')"
          PAYLOAD=$(cat <<JSON
          {
            "text": "*Zakera Nightly Load Test* — ${STATUS}\nUsers: ${USERS} | Duration: ${DURATION} | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
          }
          JSON
          )
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -s -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"
          fi

# Auto-labeling configuration for PRs

'area: backend':
  - 'src/api/**/*'
  - 'src/model/**/*'
  - 'src/tools/**/*'
  - 'src/security/**/*'
  - 'src/utils/**/*'

'area: frontend':
  - 'src/frontend/**/*'

'area: infrastructure':
  - '.github/**/*'
  - 'kubernetes/**/*'
  - 'helm/**/*'
  - 'terraform/**/*'
  - 'docker-compose*.yml'
  - 'Dockerfile*'

'area: documentation':
  - '*.md'
  - 'docs/**/*'

'area: tests':
  - 'tests/**/*'
  - 'pytest.ini'

'area: monitoring':
  - 'src/monitoring/**/*'
  - 'monitoring/**/*'

'type: dependencies':
  - 'requirements.txt'
  - 'pyproject.toml'
  - 'package.json'
  - 'package-lock.json'

# Auto-labeling configuration for PRs

'area: backend':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/api/**/*'
          - 'src/model/**/*'
          - 'src/tools/**/*'
          - 'src/security/**/*'
          - 'src/utils/**/*'

'area: frontend':
  - changed-files:
      - any-glob-to-any-file: 'src/frontend/**/*'

'area: infrastructure':
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**/*'
          - 'kubernetes/**/*'
          - 'helm/**/*'
          - 'terraform/**/*'
          - 'docker-compose*.yml'
          - 'Dockerfile*'

'area: documentation':
  - changed-files:
      - any-glob-to-any-file:
          - '*.md'
          - 'docs/**/*'

'area: tests':
  - changed-files:
      - any-glob-to-any-file:
          - 'tests/**/*'
          - 'pytest.ini'

'area: monitoring':
  - changed-files:
      - any-glob-to-any-file:
          - 'src/monitoring/**/*'
          - 'monitoring/**/*'

'type: dependencies':
  - changed-files:
      - any-glob-to-any-file:
          - 'requirements.txt'
          - 'pyproject.toml'
          - 'package.json'
          - 'package-lock.json'
